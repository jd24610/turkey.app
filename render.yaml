services:
  # ── 1. The Backend (API) ──────────────────────────────────────────────────
  - type: web
    name: turkey-app-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: API_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: turkey-app

  # ── 2. The Frontend (Static UI) ───────────────────────────────────────────
  - type: web
    name: turkey-app-frontend
    env: static
    buildCommand: "uv sync && uv run reflex export --frontend-only --no-zip"
    staticPublishDir: .web/_static
    envVars:
      - key: API_URL
        sync: false
